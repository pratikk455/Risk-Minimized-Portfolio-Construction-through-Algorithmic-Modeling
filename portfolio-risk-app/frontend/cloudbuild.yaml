steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://portfolio-backend-573269025877.us-central1.run.app'
      - '-t'
      - 'gcr.io/$PROJECT_ID/portfolio-frontend:latest'
      - '.'
images:
  - 'gcr.io/$PROJECT_ID/portfolio-frontend:latest'
timeout: '1200s'
